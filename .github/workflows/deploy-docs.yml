name: deploy-docs

on:
  push:
    branches: [main]      # 无 paths 过滤：站点会镜像图片目录，任何素材变更都需重新部署
  pull_request:
    paths:
      - 'docs/**'
      - 'social-icons/**'
      - 'tools/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm --dir docs install --frozen-lockfile
      - run: pnpm --dir docs build
      - run: pnpm --dir docs exec playwright install --with-deps --only-shell chromium
      - name: 浏览器 UI 检查
        run: pnpm --dir docs ui:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check
          path: docs/.vitepress/ui-check/
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
